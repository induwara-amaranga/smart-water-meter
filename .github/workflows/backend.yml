name: Backend

# Tests every push and pull request that touches the backend.
# Pushes to main then build the Docker image, push it to GitHub Container
# Registry and roll it out on the EC2 server over SSH.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/aws/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'deploy/aws/**', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # On pull requests, check the Docker image still builds (main builds it in deploy).
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}
    steps:
      - name: Check required settings
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          [ -n "$BACKEND_URL" ] || { echo "::error::Variable BACKEND_URL is not set (Settings → Secrets and variables → Actions → Variables), e.g. https://13-233-10-20.sslip.io"; missing=1; }
          [ -n "$EC2_HOST" ] || { echo "::error::Secret EC2_HOST is not set (the server's Elastic IP)"; missing=1; }
          [ -n "$EC2_SSH_KEY" ] || { echo "::error::Secret EC2_SSH_KEY is not set (contents of the .pem key)"; missing=1; }
          exit $missing

      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/swm-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy the stack files
        run: |
          ssh -i ~/.ssh/ec2 "$EC2_USER@$EC2_HOST" 'mkdir -p ~/swm && test -f ~/swm/.env || { echo "::error::~/swm/.env is missing on the server (see docs/DEPLOYMENT.md)"; exit 1; }'
          scp -i ~/.ssh/ec2 deploy/aws/docker-compose.yml deploy/aws/Caddyfile "$EC2_USER@$EC2_HOST:~/swm/"

      - name: Roll out on the server
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/ec2 "$EC2_USER@$EC2_HOST" bash -s <<EOF
          set -euo pipefail
          cd ~/swm
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          sed -i '/^BACKEND_IMAGE=/d' .env
          echo "BACKEND_IMAGE=$IMAGE" >> .env
          docker compose pull backend
          docker compose up -d --remove-orphans --wait --wait-timeout 300
          docker logout ghcr.io
          docker image prune -f
          EOF

      - name: Wait for the health check
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "$BACKEND_URL/health"; then echo; echo "Backend is healthy"; exit 0; fi
            echo "Not healthy yet ($i/24), retrying in 10 s..."
            sleep 10
          done
          echo "::error::$BACKEND_URL/health did not return 200 within 4 minutes. On the server: cd ~/swm && docker compose logs backend"
          exit 1
