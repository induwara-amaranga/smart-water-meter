name: Admin web

# Builds every push and pull request that touches the admin web app.
# Pushes to main then deploy the build to Cloudflare Pages.
on:
  push:
    branches: [main]
    paths: ['admin-web/**', '.github/workflows/admin-web.yml']
  pull_request:
    paths: ['admin-web/**', '.github/workflows/admin-web.yml']
  workflow_dispatch:

concurrency:
  group: admin-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      # Type-checks, then bundles with the hosted backend's URL baked in.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.BACKEND_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: admin-web/dist
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production-admin-web
      url: https://${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: admin-web-dist
          path: dist
      # First run only: create the Pages project if it doesn't exist yet.
      - name: Create the Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if npx --yes wrangler@3 pages project list | grep -qw "$PROJECT"; then
            echo "Pages project $PROJECT exists"
          else
            npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-dirty=true
